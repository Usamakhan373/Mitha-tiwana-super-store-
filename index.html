<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mitha Tiwana Super Store</title>
  <!-- Tailwind CSS CDN for modern grid design -->
  <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-gray-50 pb-24 font-sans">

  <!-- APP NAVBAR -->
  <header class="bg-green-700 text-white p-4 flex justify-between items-center sticky top-0 z-40 shadow-md">
    <div>
      <h1 class="font-extrabold text-lg">Mitha Tiwana Super Store</h1>
      <p class="text-[10px] text-green-100">Khushab • Delivery Panel Active</p>
    </div>
    <button id="adminBtn" class="bg-white text-green-700 px-4 py-1.5 rounded-full text-xs font-bold shadow hover:bg-green-50">
      Owner Panel
    </button>
  </header>

  <!-- COMPACT SEARCH BAR -->
  <div class="p-4 max-w-xl mx-auto">
    <input id="searchInput" type="text" placeholder="🔍 Kucch bhi dhoondein..." class="w-full border border-gray-200 p-3 rounded-2xl shadow-sm focus:outline-none bg-white">
  </div>

  <!-- PRODUCTS DISPLAY GRID -->
  <main class="max-w-6xl mx-auto p-4">
    <div id="loadingView" class="text-center my-20 hidden">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-green-700 mx-auto"></div>
      <p class="text-gray-400 text-xs mt-2">Products load ho rahi hain...</p>
    </div>
    <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <!-- Products will load dynamically -->
    </div>
  </main>

  <!-- POPUP MODAL (ADMIN CONTROL PANEL) -->
  <div id="adminModal" class="fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-5 w-full max-w-sm shadow-2xl relative">
      <button id="closeModalBtn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-lg">✕</button>
      
      <!-- Login View -->
      <div id="loginView">
        <h2 class="font-black text-xl text-gray-800">Owner Login</h2>
        <p class="text-xs text-gray-400 mt-0.5">Control panel open karne ke liye key enter karein</p>
        <input id="passInput" type="password" placeholder="Mitha@123" class="w-full border p-3 rounded-xl mt-4 focus:outline-none">
        <button id="loginBtn" class="w-full bg-green-700 text-white py-3 rounded-xl mt-3 font-bold shadow-md">Verify Admin Login</button>
      </div>

      <!-- Upload View -->
      <div id="uploadView" class="space-y-3 hidden">
        <div class="flex justify-between items-center border-b pb-1">
          <h2 class="font-bold text-lg text-green-700">Add Stock Active</h2>
          <button id="logoutBtn" class="text-xs text-red-500 bg-red-50 px-2 py-1 rounded">Logout</button>
        </div>
        <input id="prodName" type="text" placeholder="Item Name" class="w-full p-2.5 border rounded-xl text-sm">
        <input id="prodPrice" type="text" placeholder="Qeemat (e.g. 240)" class="w-full p-2.5 border rounded-xl text-sm">
        <input id="prodFile" type="file" accept="image/*" class="w-full p-1 text-xs text-gray-500">
        <button id="uploadBtn" class="w-full bg-blue-600 text-white py-2.5 rounded-xl text-sm font-bold shadow hover:bg-blue-700">Upload Product</button>
      </div>
    </div>
  </div>

  <!-- MOBILE FOOTERBAR -->
  <footer class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 flex justify-around items-center z-40 shadow-lg">
    <div class="text-center">
      <p class="text-[9px] text-gray-400 font-bold tracking-wider uppercase">EasyPaisa Account</p>
      <p class="text-xs font-black text-gray-800">03247296703</p>
    </div>
    <div class="h-5 w-px bg-gray-200"></div>
    <div class="text-center">
      <p class="text-[9px] text-gray-400 font-bold tracking-wider uppercase">WhatsApp Call</p>
      <p class="text-xs font-black text-green-700">+923247296703</p>
    </div>
  </footer>

  <!-- Firebase Legacy Scripts Support for Static HTML -->
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>

  <script>
    // Config Connection Details
    const firebaseConfig = {
      apiKey: "AIzaSyD-placeholder-apna-yahan-dalo", // Yara isko bas deployment ke waqt active rakhna
      authDomain: "://firebaseapp.com",
      projectId: "mitha-tiwana-store",
      storageBucket: "://appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };
    
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    let localProducts = [];
    let isLogged = false;
    let base64Image = "";

    // Fetch database entries
    async function loadData() {
      const loader = document.getElementById('loadingView');
      loader.classList.remove('hidden');
      try {
        const snap = await db.collection("products").orderBy("createdAt", "desc").get();
        localProducts = [];
        snap.forEach(doc => { localProducts.push({ id: doc.id, ...doc.data() }); });
        renderProducts(localProducts);
      } catch(e) {
        console.error("Firebase fetch error:", e);
      } finally {
        loader.classList.add('hidden');
      }
    }

    function renderProducts(items) {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = "";
      if(items.length === 0) {
        grid.innerHTML = `<p class="col-span-2 md:col-span-4 text-center text-gray-400 my-10 text-sm">Koi item nahi mila.</p>`;
        return;
      }
      items.forEach(p => {
        grid.innerHTML += `
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between p-3">
            <div>
              <img src="${p.image || ''}" alt="${p.name}" class="h-36 w-full object-cover rounded-xl bg-gray-50">
              <h3 class="font-bold text-gray-800 text-xs mt-2 line-clamp-2">${p.name}</h3>
              <p class="text-red-600 font-extrabold text-sm my-1">Rs. ${p.price}</p>
            </div>
            <div class="mt-auto pt-2">
              <a href="https://wa.me{encodeURIComponent(p.name)}" target="_blank" class="block text-center bg-[#25D366] text-white py-2 rounded-xl text-[11px] font-bold shadow-sm">🟢 WhatsApp Order</a>
              \${isLogged ? `<button onclick="deleteItem('\${p.id}')" class="w-full bg-red-50 text-red-600 py-1 rounded-lg text-[10px] font-bold mt-1 shadow-sm">Delete Item</button>` : ''}
            </div>
          </div>
        `;
      });
    }

    // Dynamic Image Compression Canvas Logic
    document.getElementById('prodFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if(!file) return;
      const r = new FileReader();
      r.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const c = document.createElement("canvas");
          c.width = 500;
          c.height = img.height * (500 / img.width);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          base64Image = c.toDataURL("image/jpeg", 0.6);
        }
        img.src = ev.target.result;
      }
      r.readAsDataURL(file);
    });

    // Upload function
    document.getElementById('uploadBtn').addEventListener('click', async function() {
      const name = document.getElementById('prodName').value;
      const price = document.getElementById('prodPrice').value;
      if(!name || !price || !base64Image) return alert("Sub data fill karein!");
      try {
        await db.collection("products").add({ name, price, image: base64Image, createdAt: Date.now() });
        document.getElementById('prodName').value = "";
        document.getElementById('prodPrice').value = "";
        base64Image = "";
        alert("Stock product uploaded successfully!");
        loadData();
      } catch(err) { alert("Upload Failed: " + err.message); }
    });

    async function deleteItem(id) {
      if(!confirm("Kya aap is item ko delete karna chahte hain?")) return;
      try {
        await db.collection("products").doc(id).delete();
        alert("Deleted!");
        loadData();
      } catch(err) { alert(err.message); }
    }

    // UI Trigger actions
    document.getElementById('adminBtn').addEventListener('click', () => document.getElementById('adminModal').classList.remove('hidden'));
    document.getElementById('closeModalBtn').addEventListener('click', () => document.getElementById('adminModal').classList.add('hidden'));
    
    document.getElementById('loginBtn').addEventListener('click', () => {
      const pass = document.getElementById('passInput').value;
      if(pass === "Mitha@123") {
        isLogged = true;
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('uploadView').classList.remove('hidden');
        renderProducts(localProducts);
      } else { alert("Wrong Control Panel Password!"); }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      isLogged = false;
      document.getElementById('uploadView').classList.add('hidden');
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('passInput').value = "";
      renderProducts(localProducts);
    });

    // Filtering search logic
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const val = e.target.value.toLowerCase();
      const filtered = localProducts.filter(p => p.name.toLowerCase().includes(val));
      renderProducts(filtered);
    });

    window.onload = loadData;
  </script>
</body>
</html>
